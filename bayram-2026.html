<style>
  :root {
    --cream: #faf4e4;
    --honey: #efd9a8;
    --honey-deep: #d9b873;
    --gold: #a8772a;
    --gold-deep: #845a1c;
    --gold-light: #c4953f;
    --ink: #2a1d0a;
    --ink-soft: #5c4424;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: 'Barlow', system-ui, sans-serif;
    background: #1a120a;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--ink);
    overflow-x: hidden;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 540px;
    aspect-ratio: 9 / 16;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(255,243,210,.95) 0%, transparent 60%),
      radial-gradient(140% 80% at 50% 100%, rgba(168,119,42,.18) 0%, transparent 65%),
      linear-gradient(180deg, #faf4e4 0%, #f3e5c4 45%, #e8d2a0 100%);
    box-shadow:
      0 30px 80px rgba(132, 90, 28, .35),
      0 8px 24px rgba(0,0,0,.25),
      inset 0 0 0 1px rgba(168,119,42,.18);
    overflow: hidden;
    padding: 48px 38px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(168,119,42,.28);
    pointer-events: none;
  }
  .card::after {
    content: '';
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(168,119,42,.12);
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 64px;
    height: 64px;
    opacity: .55;
    pointer-events: none;
  }
  .corner svg { width: 100%; height: 100%; display: block; }
  .corner.tl { top: 22px; left: 22px; }
  .corner.tr { top: 22px; right: 22px; transform: scaleX(-1); }
  .corner.bl { bottom: 22px; left: 22px; transform: scaleY(-1); }
  .corner.br { bottom: 22px; right: 22px; transform: scale(-1, -1); }

  .label {
    font-family: 'Barlow', sans-serif;
    font-size: .68rem;
    font-weight: 500;
    letter-spacing: .42em;
    color: var(--gold-deep);
    text-transform: uppercase;
    margin-top: 16px;
    position: relative;
    padding: 0 28px;
  }
  .label::before, .label::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 22px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
  }
  .label::before { left: -4px; }
  .label::after { right: -4px; }

  .ornament {
    margin: 28px 0 18px;
    color: var(--gold);
    width: 96px;
    height: 96px;
  }
  .ornament svg { width: 100%; height: 100%; display: block; }

  .greet {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2.7rem, 9.5vw, 3.6rem);
    line-height: 1.04;
    color: var(--ink);
    letter-spacing: -.005em;
    margin: 6px 0 4px;
  }
  .greet .strong {
    font-weight: 500;
    font-style: normal;
    color: var(--gold-deep);
    display: block;
    letter-spacing: .005em;
  }
  .divider {
    width: 56px;
    height: 1px;
    background: var(--gold);
    margin: 24px auto;
    position: relative;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
  }
  .divider::before { left: -10px; }
  .divider::after { right: -10px; }

  .verse {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.05rem, 3.6vw, 1.22rem);
    line-height: 1.7;
    color: var(--ink-soft);
    max-width: 320px;
    margin: 0 auto;
  }

  .spacer { flex: 1; min-height: 16px; }

  .sign {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .sign-monogram {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-weight: 600;
    font-size: 2.4rem;
    color: var(--gold-deep);
    letter-spacing: .04em;
    line-height: 1;
    text-shadow: 0 1px 0 rgba(255,255,255,.4);
  }
  .sign-firm {
    font-family: 'Barlow', sans-serif;
    font-size: .66rem;
    font-weight: 500;
    letter-spacing: .28em;
    color: var(--ink);
    text-transform: uppercase;
    margin-top: 8px;
  }
  .sign-url {
    font-family: 'Barlow', sans-serif;
    font-size: .62rem;
    font-weight: 400;
    letter-spacing: .18em;
    color: var(--gold-deep);
    text-transform: lowercase;
    margin-top: 4px;
  }

  .year-tag {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: .9rem;
    color: var(--gold);
    margin-top: 14px;
    letter-spacing: .05em;
  }

  @media (max-width: 420px) {
    .card { padding: 38px 26px; }
    .ornament { width: 78px; height: 78px; margin: 18px 0 14px; }
    .divider { margin: 18px auto; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .card { box-shadow: none; max-width: none; width: 100%; height: 100vh; aspect-ratio: auto; }
  }

  .hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Barlow', sans-serif;
    font-size: .68rem;
    letter-spacing: .15em;
    color: rgba(250,244,228,.55);
    text-transform: uppercase;
    padding: 8px 16px;
    background: rgba(0,0,0,.35);
    backdrop-filter: blur(4px);
    border-radius: 999px;
    pointer-events: none;
  }
  @media print { .hint { display: none; } }
</style>
